<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEAL - Aplikasi Kesehatan Fisik & Mental Remaja</title>
    
    <!-- Link PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ec4899" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Registrasi Service Worker untuk Mode Offline & PWA (Hanya aktif di Web Browser, dilewati di Native APK) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          if (!window.Capacitor || !window.Capacitor.isNativePlatform()) {
            navigator.serviceWorker.register('/sw.js')
              .then((reg) => console.log('Service Worker terdaftar: ', reg.scope))
              .catch((err) => console.log('Pendaftaran Service Worker gagal: ', err));
          } else {
            console.log('Native Capacitor platform terdeteksi: Pendaftaran Service Worker dilewati untuk menghindari konflik cache.');
          }
        });
      }
    </script>
  </body>
</html>
